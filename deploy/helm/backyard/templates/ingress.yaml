{{- if .Values.ingress.enabled }}
{{- $fullname := include "backyard.fullname" . }}
{{- $port := .Values.service.port }}
{{- $hosts := .Values.ingress.hosts }}
{{- if not $hosts }}
{{- $domain := include "backyard.baseDomain" . }}
{{- $hosts = list $domain }}
{{- if eq (include "backyard.urlMode" .) "host" }}
{{- $hosts = append $hosts (printf "*.%s" $domain) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backyard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ $port }}
    {{- end }}
{{- end }}
