{{- if .Values.networkPolicy.enabled }}
# Only networkPolicy.from may reach the HTTP port (and networkPolicy.metricsFrom
# the metrics port). The kubelet's probes come from the node and are always
# allowed; egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backyard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backyard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- tpl (toYaml .Values.networkPolicy.from) . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
    {{- if and .Values.networkPolicy.metricsFrom (dig "telemetry" "metrics_listen" "" .Values.config) }}
    - from:
        {{- tpl (toYaml .Values.networkPolicy.metricsFrom) . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.metrics }}
    {{- end }}
{{- end }}
