apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backyard.labels" . | nindent 4 }}
data:
  backyard.yaml: |
    # Rendered from the chart's `config` value. Secrets come from the environment.
    {{- include "backyard.config" . | nindent 4 }}
