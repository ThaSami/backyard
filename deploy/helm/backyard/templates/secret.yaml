{{- if include "backyard.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backyard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backyard.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  BACKYARD_SECRET: {{ include "backyard.backyardSecret" . | b64enc | quote }}
  {{- range $key, $value := .Values.secret.env }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $key) }}
  {{- fail (printf "secret.env: %q is not a valid environment variable name" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
