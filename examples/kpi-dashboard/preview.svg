  <circle cx="1143" cy="513" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="1143" cy="637.6" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
