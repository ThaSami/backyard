<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="#0b0b0b">
  <!-- KPI Dashboard with a warehouse named query, drawn by hand for the hub's site card. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .muted { fill: #52514e; }
    .box { fill: #fcfcfb; stroke: #0b0b0b; stroke-opacity: .1; stroke-width: 1.1; }
    .label { font-size: 14px; fill: #52514e; }
    .tick { font-size: 12.5px; fill: #6b6964; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .line { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .end { font-size: 13.5px; font-weight: 600; }
  </style>

  <rect width="1280" height="720" fill="#f9f9f7"/>

  <!-- header: source, title, date range -->
  <text x="46" y="66" class="muted" font-size="12.9" font-weight="700" letter-spacing=".9">WAREHOUSE · KPI_DAILY</text>
  <text x="44" y="112" font-size="39.6" font-weight="700" letter-spacing="-.8">KPI Dashboard</text>
  <rect x="964.5" y="84.5" width="269" height="37" rx="11" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity=".1"/>
  <rect x="1045.5" y="85" width="95" height="36" fill="#2a78d6" fill-opacity=".12"/>
  <path d="M1045.5 85v36M1140.5 85v36" stroke="#0b0b0b" stroke-opacity=".1"/>
  <text x="1005" y="109" class="muted" font-size="16.5" text-anchor="middle">7 days</text>
  <text x="1093" y="109" font-size="16.5" font-weight="700" text-anchor="middle">30 days</text>
  <text x="1187" y="109" class="muted" font-size="16.5" text-anchor="middle">90 days</text>

  <!-- stat tiles -->
  <rect x="46.5" y="141.5" width="584" height="156" rx="15.4" class="box"/>
  <text x="67" y="174" class="label">Orders · last 30 days</text>
  <text x="65" y="239" font-size="49.5" font-weight="700" letter-spacing="-1">7.3K</text>
  <text x="67" y="275" class="label">▲ 2.9% · last 7 days vs the 7 before</text>
  <rect x="649.5" y="141.5" width="584" height="156" rx="15.4" class="box"/>
  <text x="670" y="174" class="label">Returns · last 30 days</text>
  <text x="669" y="220" font-size="33" font-weight="700" letter-spacing="-.6">681</text>
  <text x="670" y="254" class="label">▲ 1.7% · last 7 days vs the 7 before</text>

  <!-- trend chart -->
  <rect x="46.5" y="316.5" width="1187" height="385" rx="15.4" class="box"/>
  <text x="67" y="351" font-size="16.5" font-weight="700">Daily trend</text>
  <path d="M1047 345h15" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round"/>
