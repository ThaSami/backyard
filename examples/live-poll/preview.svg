<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="#1d1c1a">
  <!-- Live Poll's host view (?host) during a round, drawn by hand for the hub's site card. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #5f5d58; }
    .label { font-size: 14.5px; font-weight: 600; fill: #5f5d58; }
    .value { font-size: 17px; }
    .panel { fill: #fff; stroke: #e4e2dc; stroke-width: 1; }
    .input { fill: #f6f5f1; stroke: #e4e2dc; stroke-width: 1; }
    .x { stroke: #5f5d58; stroke-width: 1.8; stroke-linecap: round; }
    .opt { font-size: 19.5px; }
    .num { font-size: 19.5px; fill: #5f5d58; }
    .track { fill: #0b0b0b; fill-opacity: .07; }
    .fill { fill: #2266c8; }
  </style>
  <defs>
    <clipPath id="question"><rect x="88" y="141" width="304" height="47"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="#f6f5f1"/>

  <!-- editor -->
  <rect x="50.5" y="44.5" width="379" height="612" rx="16" class="panel"/>
  <text x="74" y="87" font-size="18.7" font-weight="700">New question</text>
  <text x="74" y="129" class="label">Question</text>
  <rect x="74.5" y="141.5" width="331" height="46" rx="10" class="input"/>
  <text x="89" y="171" class="value" clip-path="url(#question)">What should our next hack week focus on?</text>
  <text x="74" y="218" class="label">Options</text>
  <rect x="74.5" y="229.5" width="291" height="46" rx="10" class="input"/>
  <text x="89" y="259" class="value">Developer tooling</text>
  <path d="M384 247l10 10M394 247l-10 10" class="x"/>
  <rect x="74.5" y="284.5" width="291" height="46" rx="10" class="input"/>
  <text x="89" y="314" class="value">Customer dashboards</text>
  <path d="M384 302l10 10M394 302l-10 10" class="x"/>
  <rect x="74.5" y="339.5" width="291" height="46" rx="10" class="input"/>
  <text x="89" y="369" class="value">Internal AI helpers</text>
  <path d="M384 357l10 10M394 357l-10 10" class="x"/>
  <rect x="74.5" y="394.5" width="291" height="46" rx="10" class="input"/>
  <text x="89" y="424" class="value">Performance</text>
  <path d="M384 412l10 10M394 412l-10 10" class="x"/>
  <text x="74" y="468" font-size="15.3" fill="#2266c8">+ Add option</text>
  <rect x="74" y="496" width="168" height="46" rx="10" fill="#2266c8"/>
  <text x="158" y="525" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Start new round</text>
  <path d="M74 567.5h332" stroke="#e4e2dc" stroke-width="1"/>
  <text x="74" y="614" class="muted" font-size="17">Audience link</text>
  <text x="192" y="613" class="mono" font-size="14.5">https://live…</text>
  <rect x="323.5" y="585.5" width="82" height="46" rx="10" fill="#fff" stroke="#e4e2dc"/>
  <text x="364.5" y="614" font-size="17" font-weight="700" text-anchor="middle">Copy</text>

  <!-- stage: the live round -->
  <rect x="452.5" y="44.5" width="777" height="581" rx="16" class="panel"/>
  <text x="476" y="82" font-size="13.6" font-weight="700" letter-spacing=".8" fill="#087f08">ROUND 1 · VOTING OPEN</text>
  <text x="1206" y="84" class="muted" font-size="17" text-anchor="end">12 watching</text>
  <text x="474" y="150" font-size="44.8" font-weight="700" letter-spacing="-.9">What should our next hack week</text>
  <text x="474" y="203" font-size="44.8" font-weight="700" letter-spacing="-.9">focus on?</text>

  <text x="476" y="258" class="opt">Developer tooling</text>
  <text x="1206" y="258" class="num" text-anchor="end">30% · 3</text>
  <rect x="476" y="273" width="730" height="18" rx="9" class="track"/>
  <rect x="476" y="273" width="219" height="18" rx="9" class="fill"/>

  <text x="476" y="326" class="opt">Customer dashboards</text>
  <text x="1206" y="326" class="num" text-anchor="end">10% · 1</text>
  <rect x="476" y="341" width="730" height="18" rx="9" class="track"/>
  <rect x="476" y="341" width="73" height="18" rx="9" class="fill"/>

  <text x="476" y="394" class="opt" font-weight="700">Internal AI helpers</text>
  <text x="1206" y="394" class="num" text-anchor="end">50% · 5</text>
  <rect x="476" y="409" width="730" height="18" rx="9" class="track"/>
  <rect x="476" y="409" width="365" height="18" rx="9" class="fill"/>

  <text x="476" y="462" class="opt">Performance</text>
  <text x="1206" y="462" class="num" text-anchor="end">10% · 1</text>
  <rect x="476" y="477" width="730" height="18" rx="9" class="track"/>
  <rect x="476" y="477" width="73" height="18" rx="9" class="fill"/>

  <text x="476" y="530" class="muted" font-size="15.3">10 answers</text>
  <rect x="476.5" y="553.5" width="141" height="47" rx="10" fill="#fff" stroke="#e4e2dc"/>
  <text x="547" y="583" font-size="17" font-weight="700" text-anchor="middle">Close voting</text>
</svg>
