<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Lunch Vote's main screen, drawn by hand for the hub's site card. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink { fill: #1d1c1a; }
    .muted { fill: #5f5d58; }
    .name { font-size: 24px; font-weight: 600; fill: #1d1c1a; }
    .count { font-size: 30px; font-weight: 700; fill: #1d1c1a; }
    .ini { font-size: 18px; font-weight: 700; fill: #fff; }
    .ini-sm { font-size: 13px; font-weight: 700; fill: #fff; }
    .card { fill: #fff; stroke: #e4e2dc; stroke-width: 1.5; }
    .track { fill: #1d1c1a; fill-opacity: .08; }
    .fill { fill: #2266c8; }
  </style>
  <defs>
    <symbol id="ramen" viewBox="0 0 40 40">
      <path d="M24 2 12 19M31 4 18 19" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="20" cy="19" rx="16.5" ry="4" fill="#f2c14e"/>
      <path d="M8 18.5q3-3 6 0t6 0t6 0t6 0" fill="none" stroke="#e39a2d" stroke-width="1.6"/>
      <path d="M3 19A17 15 0 0 0 37 19Z" fill="#d8452f"/>
      <path d="M6 24.5h28" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="3 2.5"/>
      <rect x="14" y="32.5" width="12" height="3.5" rx="1.75" fill="#b03722"/>
    </symbol>
    <symbol id="taco" viewBox="0 0 40 40">
      <circle cx="9" cy="17" r="4.5" fill="#5bb045"/>
      <circle cx="15" cy="12" r="4.5" fill="#5bb045"/>
      <circle cx="22" cy="10.5" r="4.5" fill="#5bb045"/>
      <circle cx="29" cy="13" r="4.5" fill="#5bb045"/>
      <circle cx="33" cy="18" r="4" fill="#5bb045"/>
      <circle cx="18" cy="11" r="3" fill="#e0533d"/>
      <circle cx="27" cy="12.5" r="2.6" fill="#e0533d"/>
      <path d="M3 31A17 16 0 0 1 37 31Z" fill="#f3b23c" stroke="#d48f1f" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="13" cy="25" r="1.2" fill="#d48f1f"/>
      <circle cx="21" cy="21" r="1.2" fill="#d48f1f"/>
      <circle cx="27" cy="26" r="1.2" fill="#d48f1f"/>
    </symbol>
    <symbol id="sushi" viewBox="0 0 40 40">
      <rect x="5" y="19" width="30" height="14" rx="6" fill="#fff" stroke="#d9d6cf" stroke-width="1.5"/>
      <path d="M4 22q16-15 32 0v1.5H4z" fill="#f47b4f"/>
      <path d="M12 16l3 6M20 13l2.5 8.5M28 15l1.5 7" stroke="#ffd2c0" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="17" y="16" width="6.5" height="17" fill="#24382c"/>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="#f6f5f1"/>

  <!-- header: date, title, people deciding -->
  <text x="130" y="74" class="muted" font-size="19" font-weight="600" letter-spacing="1.4">FRIDAY, JUNE 12</text>
  <text x="127" y="136" class="ink" font-size="56" font-weight="700" letter-spacing="-1.1">Where should we eat?</text>
  <g>
    <circle cx="848.5" cy="116" r="28.5" fill="#087f08"/><circle cx="848.5" cy="116" r="25.5" fill="#f6f5f1"/>
    <circle cx="848.5" cy="116" r="22.5" fill="#2266c8"/><text x="848.5" y="122.5" class="ini" text-anchor="middle">MC</text>
    <circle cx="887.5" cy="116" r="28.5" fill="#087f08"/><circle cx="887.5" cy="116" r="25.5" fill="#f6f5f1"/>
    <circle cx="887.5" cy="116" r="22.5" fill="#c4501d"/><text x="887.5" y="122.5" class="ini" text-anchor="middle">JB</text>
    <circle cx="926.5" cy="116" r="28.5" fill="#087f08"/><circle cx="926.5" cy="116" r="25.5" fill="#f6f5f1"/>
    <circle cx="926.5" cy="116" r="22.5" fill="#0f7f57"/><text x="926.5" y="122.5" class="ini" text-anchor="middle">PN</text>
    <circle cx="965.5" cy="116" r="28.5" fill="#087f08"/><circle cx="965.5" cy="116" r="25.5" fill="#f6f5f1"/>
    <circle cx="965.5" cy="116" r="22.5" fill="#6250d6"/><text x="965.5" y="122.5" class="ini" text-anchor="middle">SO</text>
    <circle cx="1004.5" cy="116" r="25.5" fill="#f6f5f1"/>
    <circle cx="1004.5" cy="116" r="22.5" fill="#b8467a"/><text x="1004.5" y="122.5" class="ini" text-anchor="middle">AK</text>
  </g>
  <text x="1150" y="123" class="muted" font-size="21" text-anchor="end">5 deciding</text>

  <!-- leader banner -->
  <rect x="130" y="168" width="1020" height="72" rx="18" fill="#2266c8" fill-opacity=".12"/>
  <use href="#ramen" x="152" y="187" width="34" height="34"/>
  <text x="196" y="213" class="ink" font-size="24" font-weight="600">Ramen Shop is winning with 3 votes</text>

  <!-- spots: your vote, then by votes -->
  <rect x="130" y="262" width="964" height="92" rx="21" fill="#fff" stroke="#2266c8" stroke-width="3"/>
  <use href="#ramen" x="154" y="287" width="42" height="42"/>
  <text x="217" y="302" class="name">Ramen Shop<tspan dx="14" font-size="19" font-weight="500" fill="#2266c8">✓ your vote</tspan></text>
  <rect x="217" y="319" width="666" height="9" rx="4.5" class="track"/>
  <rect x="217" y="319" width="666" height="9" rx="4.5" class="fill"/>
  <circle cx="921.5" cy="308" r="16.5" fill="#2266c8"/><text x="921.5" y="312.5" class="ini-sm" text-anchor="middle">MC</text>
  <circle cx="957.5" cy="308" r="16.5" fill="#c4501d"/><text x="957.5" y="312.5" class="ini-sm" text-anchor="middle">JB</text>
  <circle cx="993.5" cy="308" r="16.5" fill="#0f7f57"/><text x="993.5" y="312.5" class="ini-sm" text-anchor="middle">PN</text>
  <text x="1070" y="319" class="count" text-anchor="end">3</text>

  <rect x="130" y="368" width="964" height="92" rx="21" class="card"/>
  <use href="#taco" x="154" y="393" width="42" height="42"/>
  <text x="217" y="408" class="name">Taco Truck</text>
  <rect x="217" y="425" width="738" height="9" rx="4.5" class="track"/>
  <rect x="217" y="425" width="246" height="9" rx="4.5" class="fill"/>
  <circle cx="993.5" cy="414" r="16.5" fill="#6250d6"/><text x="993.5" y="418.5" class="ini-sm" text-anchor="middle">SO</text>
  <text x="1070" y="425" class="count" text-anchor="end">1</text>

  <rect x="130" y="474" width="964" height="92" rx="21" class="card"/>
  <use href="#sushi" x="154" y="499" width="42" height="42"/>
  <text x="217" y="514" class="name">Sushi Bar</text>
  <rect x="217" y="531" width="771" height="9" rx="4.5" class="track"/>
  <text x="1070" y="531" class="count" text-anchor="end">0</text>
  <path d="M1114 512l16 16M1130 512l-16 16" stroke="#5f5d58" stroke-width="2.4" stroke-linecap="round"/>

  <!-- add a place -->
  <rect x="130" y="596" width="100" height="68" rx="18" class="card"/>
  <use href="#ramen" x="145" y="613" width="34" height="34"/>
  <path d="M196 624l7 7 7-7" fill="none" stroke="#5f5d58" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="242" y="596" width="780" height="68" rx="18" class="card"/>
  <text x="264" y="638" font-size="24" fill="#8b8984">Add a place…</text>
  <rect x="1034" y="596" width="116" height="68" rx="18" fill="#2266c8"/>
  <text x="1092" y="638" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">Add</text>
</svg>
