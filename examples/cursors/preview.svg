<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="#1d1c1a">
  <!-- Cursors: the shared board with other people's cursors, drawn by hand for the hub's site card. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .who { font-size: 18px; font-weight: 600; fill: #fff; }
    .person { font-size: 21px; }
    .arrow { stroke: #fff; stroke-width: 1.5; stroke-linejoin: round; }
    .surface { fill: #fff; fill-opacity: .93; stroke: #e4e2dc; stroke-width: 1.5; }
  </style>
  <defs>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.8" fill="#0b0b0b" fill-opacity=".1"/>
    </pattern>
    <path id="arrow" d="M2 2l16 8.5-7 1.8-3.3 7.2z"/>
    <symbol id="heart" viewBox="0 0 32 32">
      <path d="M16 28C6 21 2 15.5 2 10.5 2 6.4 5.2 3.5 9 3.5c3 0 5.4 1.8 7 4.3 1.6-2.5 4-4.3 7-4.3 3.8 0 7 2.9 7 7 0 5-4 10.5-14 17.5z" fill="#e53935"/>
    </symbol>
    <symbol id="wave" viewBox="0 0 32 32">
      <g transform="rotate(-18 16 18)" fill="#f7c33c" stroke="#d99a16" stroke-width="1.2">
        <rect x="9" y="5" width="4.6" height="15" rx="2.3"/>
        <rect x="13.8" y="3" width="4.6" height="16" rx="2.3"/>
        <rect x="18.6" y="4.5" width="4.6" height="15" rx="2.3"/>
        <rect x="23.2" y="8" width="4.2" height="12" rx="2.1"/>
        <path d="M9 15c-3-3-6-1.5-4.5 1.5l4 6.5C10.5 27 14 29 18 29c5.5 0 9.5-4 9.5-9.5V15H9z"/>
      </g>
      <path d="M3 9a8 8 0 0 1 4-5M27 25a8 8 0 0 1-4 5" fill="none" stroke="#8ab4e8" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="party" viewBox="0 0 32 32">
      <path d="M3 29l7-20 13 13z" fill="#f2a33a" stroke="#d07e14" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M6.5 19l6.5 6.5M8.5 13.5l10 10" stroke="#e5534b" stroke-width="2"/>
      <circle cx="20" cy="5" r="2" fill="#4c8be0"/><circle cx="27" cy="11" r="2" fill="#e5534b"/>
      <circle cx="25" cy="3.5" r="1.6" fill="#38a169"/><circle cx="29" cy="18" r="1.6" fill="#9b59d0"/>
      <path d="M14 7c1-3 4-3 4-6M21 14c3-1 5 1 8-1" fill="none" stroke="#9b59d0" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="fire" viewBox="0 0 32 32">
      <path d="M16 30c-6.5 0-11-4.2-11-10 0-5.5 4-8.5 6-14 2.5 2 3.5 4.5 3.5 7 1.5-1.2 2.5-3 2.5-5.5C22.5 11 27 15 27 20.5 27 26 22.5 30 16 30z" fill="#f4791f"/>
      <path d="M16 30c-3.3 0-5.5-2.2-5.5-5.2 0-3 2.2-4.8 3.6-7.6 1.4 1.4 1.9 2.8 1.9 4.3 1-.7 1.7-1.9 1.9-3.4 2.4 2 3.6 4.2 3.6 6.7 0 3-2.2 5.2-5.5 5.2z" fill="#ffc93c"/>
    </symbol>
    <symbol id="eyes" viewBox="0 0 32 32">
      <ellipse cx="9.5" cy="16" rx="7" ry="10" fill="#fff" stroke="#8f8d87" stroke-width="1.4"/>
      <ellipse cx="22.5" cy="16" rx="7" ry="10" fill="#fff" stroke="#8f8d87" stroke-width="1.4"/>
      <circle cx="11.5" cy="18" r="3.6" fill="#2b2a28"/><circle cx="24.5" cy="18" r="3.6" fill="#2b2a28"/>
    </symbol>
    <symbol id="rocket" viewBox="0 0 32 32">
      <g transform="rotate(45 16 16)">
        <path d="M11 22l-4 5h6zM21 22l4 5h-6z" fill="#e5534b"/>
        <path d="M16 1c5 4 6.5 10 6.5 15v8h-13v-8C9.5 11 11 5 16 1z" fill="#e8e6e1" stroke="#a9a69e" stroke-width="1.2"/>
        <circle cx="16" cy="12" r="3.2" fill="#4c8be0" stroke="#a9a69e" stroke-width="1"/>
        <path d="M13 25h6l-3 6z" fill="#f4a12a"/>
      </g>
    </symbol>
  </defs>

  <rect width="1280" height="720" fill="#f6f5f1"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- a reaction floating up where someone clicked -->
  <use href="#heart" x="664" y="318" width="44" height="44"/>
  <use href="#heart" x="684" y="248" width="38" height="38" opacity=".45"/>
  <use href="#party" x="300" y="452" width="44" height="44" opacity=".85"/>

  <!-- other people's cursors -->
  <g transform="translate(420 290)">
    <use href="#arrow" class="arrow" fill="#0f7f57" transform="scale(1.5)"/>
    <rect x="24" y="27" width="132" height="32" rx="16" fill="#0f7f57"/>
    <text x="90" y="49" class="who" text-anchor="middle">Jonas Berg</text>
  </g>
  <g transform="translate(760 400)">
    <use href="#arrow" class="arrow" fill="#b8467a" transform="scale(1.5)"/>
    <path d="M30 27H166A18 18 0 0 1 184 45V78A18 18 0 0 1 166 96H42A18 18 0 0 1 24 78V33A6 6 0 0 1 30 27Z" fill="#b8467a"/>
    <text x="39" y="54" class="who">Priya Nair</text>
    <text x="39" y="83" font-size="21" fill="#fff">Love this!</text>
  </g>
  <g transform="translate(560 540)">
    <use href="#arrow" class="arrow" fill="#6250d6" transform="scale(1.5)"/>
    <rect x="24" y="27" width="122" height="32" rx="16" fill="#6250d6"/>
    <text x="85" y="49" class="who" text-anchor="middle">Sam Ortiz</text>
  </g>

  <!-- who is here -->
  <rect x="926" y="24" width="330" height="226" rx="21" class="surface"/>
  <text x="947" y="62" font-size="21" font-weight="700">Here now</text>
  <text x="1235" y="62" font-size="18" fill="#5f5d58" text-anchor="end">live</text>
  <circle cx="954.5" cy="96" r="7.5" fill="#9a6500"/><text x="974" y="103" class="person">Maya Chen (you)</text>
  <circle cx="954.5" cy="135" r="7.5" fill="#0f7f57"/><text x="974" y="142" class="person">Jonas Berg</text>
  <circle cx="954.5" cy="174" r="7.5" fill="#b8467a"/><text x="974" y="181" class="person">Priya Nair</text>
  <circle cx="954.5" cy="213" r="7.5" fill="#6250d6"/><text x="974" y="220" class="person">Sam Ortiz</text>

  <!-- toast -->
  <rect x="24" y="631" width="214" height="46" rx="15" fill="#1d1c1a"/>
  <text x="131" y="661" font-size="21" fill="#f6f5f1" text-anchor="middle">Sam Ortiz joined</text>

  <!-- reactions toolbar -->
  <rect x="289" y="615" width="703" height="78" rx="39" class="surface"/>
  <text x="540" y="661" font-size="21" fill="#5f5d58" text-anchor="end">Click to react · press</text>
  <rect x="550" y="639.5" width="28" height="27" rx="6" fill="none" stroke="#e4e2dc" stroke-width="1.5"/>
  <text x="564" y="659" class="mono" font-size="17" fill="#5f5d58" text-anchor="middle">/</text>
  <text x="588" y="661" font-size="21" fill="#5f5d58">to chat</text>
  <circle cx="698" cy="654" r="25" fill="#2266c8" fill-opacity=".22"/>
  <use href="#wave" x="683" y="639" width="30" height="30"/>
  <use href="#party" x="734" y="639" width="30" height="30"/>
  <use href="#heart" x="785" y="639" width="30" height="30"/>
  <use href="#fire" x="836" y="639" width="30" height="30"/>
  <use href="#eyes" x="887" y="639" width="30" height="30"/>
  <use href="#rocket" x="938" y="639" width="30" height="30"/>
</svg>
