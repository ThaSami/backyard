<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="#1d1c1a">
  <!-- AI Chat while an answer streams in, drawn by hand for the hub's site card. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .body { font-size: 22.4px; }
    .muted { fill: #5f5d58; }
    .control { fill: #f6f5f1; stroke: #e4e2dc; stroke-width: 1.4; }
    .chevron { fill: none; stroke: #1d1c1a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1280" height="720" fill="#f6f5f1"/>

  <!-- top bar: title, model picker, answer style, new chat -->
  <rect width="1280" height="84" fill="#fff"/>
  <path d="M0 84.5h1280" stroke="#e4e2dc" stroke-width="1.4"/>
  <path d="M24 30a8 8 0 0 1 8-8h14a8 8 0 0 1 8 8v8a8 8 0 0 1-8 8h-8l-8 7v-7a8 8 0 0 1-6-8z" fill="#dfe7f1" stroke="#8d9bab" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="33" cy="34" r="1.8" fill="#6b7785"/><circle cx="39" cy="34" r="1.8" fill="#6b7785"/><circle cx="45" cy="34" r="1.8" fill="#6b7785"/>
  <text x="62" y="49" font-size="22.4" font-weight="700">AI Chat</text>

  <text x="680" y="48" class="muted" font-size="16.8" text-anchor="end">Model</text>
  <rect x="690" y="20" width="198" height="44" rx="11" class="control"/>
  <text x="704" y="48" font-size="17.6">smart</text>
  <path d="M862 38l6 6 6-6" class="chevron"/>
  <text x="942" y="48" class="muted" font-size="16.8" text-anchor="end">Style</text>
  <rect x="952" y="20" width="180" height="44" rx="11" class="control"/>
  <text x="966" y="48" font-size="17.6">Helpful</text>
  <path d="M1106 38l6 6 6-6" class="chevron"/>
  <rect x="1146" y="17" width="112" height="50" rx="11" fill="none" stroke="#e4e2dc" stroke-width="1.4"/>
  <text x="1202" y="48" font-size="17.6" text-anchor="middle">New chat</text>

  <!-- the question -->
  <path d="M617 120H1147A25 25 0 0 1 1172 145V184A6 6 0 0 1 1166 190H617A25 25 0 0 1 592 165V145A25 25 0 0 1 617 120Z" fill="#2266c8"/>
  <text x="882" y="163" class="body" fill="#fff" text-anchor="middle">Give me 5 ideas for an internal hack week project</text>

  <!-- the answer, streaming -->
  <text x="108" y="250" class="body">Here are five ideas your team could build in a week:</text>
  <g class="body">
    <text x="133" y="304" text-anchor="end">1.</text>
    <text x="141" y="304"><tspan font-weight="700">Release radar:</tspan> one page with everything that shipped this week</text>
    <text x="133" y="340" text-anchor="end">2.</text>
    <text x="141" y="340"><tspan font-weight="700">Lunch roulette:</tspan> random lunch pairs across teams</text>
    <text x="133" y="376" text-anchor="end">3.</text>
    <text x="141" y="376"><tspan font-weight="700">Meeting cost meter:</tspan> a live counter for recurring meetings</text>
    <text x="133" y="412" text-anchor="end">4.</text>
    <text x="141" y="412"><tspan font-weight="700">Office map:</tspan> find desks, rooms and people</text>
    <text x="133" y="448" text-anchor="end">5.</text>
    <text x="141" y="448"><tspan font-weight="700">Ask the handbook:</tspan> an AI search over the team<tspan fill="#2266c8">▍</tspan></text>
  </g>

  <!-- composer (sending is disabled while the answer streams) -->
  <rect x="108" y="623" width="1064" height="75" rx="25" fill="#fff" stroke="#e4e2dc" stroke-width="1.4"/>
  <text x="130" y="668" class="body" fill="#8b8984">Message the AI…  (Enter to send, Shift+Enter for a new line)</text>
  <circle cx="1134" cy="660.5" r="26.6" fill="#2266c8" fill-opacity=".45"/>
  <path d="M1134 673v-25M1123 659l11-11 11 11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
