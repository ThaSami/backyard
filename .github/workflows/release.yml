name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release (binaries, Lambda zips,
# checksums, SBOMs) and the multi-arch image ghcr.io/thasami/backyard with
# GoReleaser (.goreleaser.yaml). Tags with a pre-release suffix (v1.2.0-rc.1)
# are marked as pre-releases and do not move the "latest" image tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push ghcr.io/thasami/backyard
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs the history and previous tag
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pre-release checks
        run: |
          node web/sdk/build.mjs --check
          go vet ./...
          go test -short -count=1 ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
